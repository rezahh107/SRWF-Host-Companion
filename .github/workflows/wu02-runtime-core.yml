name: WU-02 Runtime Core

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'srwf-host-companion.php'
      - 'src/**'
      - 'templates/**'
      - 'tests/runtime-lab/wu02-runtime-core.php'
      - '.github/workflows/wu02-runtime-core.yml'

permissions:
  contents: read

jobs:
  runtime-core:
    name: WordPress runtime core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SRWF_WP_PATH: /tmp/srwf-host-companion-wordpress
      SRWF_ARTIFACT_DIR: /tmp/srwf-host-companion-artifacts
      SRWF_WU02_EVIDENCE_PATH: /tmp/srwf-host-companion-artifacts/wu02-runtime-core.json
      SRWF_WP_VERSION: '7.1.1'
      SRWF_PHP_VERSION: '8.3.33'
      SRWF_TT25_VERSION: '1.5'
      SRWF_WP_CLI: /tmp/wp-cli.phar
      SRWF_WP_CLI_VERSION: '2.12.0'
      SRWF_WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c

    steps:
      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert repository and checkout identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'rezahh107/SRWF-Host-Companion'
          observed="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$observed" = "$expected"
          mkdir -p "$SRWF_ARTIFACT_DIR" "$SRWF_WP_PATH"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.33'
          coverage: none
          extensions: mysqli

      - name: Validate PHP syntax and exact PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "$SRWF_PHP_VERSION"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z)

      - name: Install exact WP-CLI and WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 \
            -o "$SRWF_WP_CLI" \
            "https://github.com/wp-cli/wp-cli/releases/download/v${SRWF_WP_CLI_VERSION}/wp-cli-${SRWF_WP_CLI_VERSION}.phar"
          printf '%s  %s\n' "$SRWF_WP_CLI_SHA256" "$SRWF_WP_CLI" | sha256sum -c -
          php "$SRWF_WP_CLI" core download --path="$SRWF_WP_PATH" --version="$SRWF_WP_VERSION" --force
          php "$SRWF_WP_CLI" config create --path="$SRWF_WP_PATH" \
            --dbname=wordpress --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          admin_password="$(openssl rand -hex 24)"
          php "$SRWF_WP_CLI" core install --path="$SRWF_WP_PATH" \
            --url=http://127.0.0.1:8080 --title='SRWF Host Companion WU-02 Lab' \
            --admin_user=runtime_admin --admin_password="$admin_password" \
            --admin_email='runtime@example.invalid' --skip-email
          unset admin_password
          test "$(php "$SRWF_WP_CLI" core version --path="$SRWF_WP_PATH")" = "$SRWF_WP_VERSION"
          php "$SRWF_WP_CLI" theme install twentytwentyfive --version="$SRWF_TT25_VERSION" --force --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=version --path="$SRWF_WP_PATH")" = "$SRWF_TT25_VERSION"
          php "$SRWF_WP_CLI" theme activate twentytwentyfive --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=status --path="$SRWF_WP_PATH")" = 'active'

      - name: Install product plugin and prove pre-activation isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          plugin_dir="$SRWF_WP_PATH/wp-content/plugins/srwf-host-companion"
          mkdir -p "$plugin_dir"
          cp srwf-host-companion.php "$plugin_dir/"
          cp -R src templates "$plugin_dir/"
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval 'exit( class_exists("SRWF\\HostCompanion\\Configuration", false) ? 1 : 0 );'

          unrelated_id="$(php "$SRWF_WP_CLI" post create --path="$SRWF_WP_PATH" --post_type=page --post_status=publish --post_title='SRWF WU-02 Unrelated Sentinel' --porcelain)"
          legacy_id="$(php "$SRWF_WP_CLI" post create --path="$SRWF_WP_PATH" --post_type=page --post_status=publish --post_title='SRWF WU-02 Legacy Sentinel' --porcelain)"
          php "$SRWF_WP_CLI" post meta update "$legacy_id" _wp_page_template legacy-existing-template --path="$SRWF_WP_PATH" >/dev/null
          echo "SRWF_WU02_UNRELATED_PAGE_ID=$unrelated_id" >> "$GITHUB_ENV"
          echo "SRWF_WU02_LEGACY_PAGE_ID=$legacy_id" >> "$GITHUB_ENV"

      - name: Activate product plugin and capture WU-02 runtime facts
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" plugin activate srwf-host-companion --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" plugin get srwf-host-companion --field=status --path="$SRWF_WP_PATH")" = 'active'
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval 'exit( class_exists("SRWF\\HostCompanion\\Configuration", false) && class_exists("SRWF\\HostCompanion\\TemplateRegistrar", false) && class_exists("SRWF\\HostCompanion\\PageTemplateAssignment", false) ? 0 : 1 );'
          export SRWF_WU02_PHASE=active
          page_id="$(php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/runtime-lab/wu02-runtime-core.php" | tail -n 1)"
          [[ "$page_id" =~ ^[0-9]+$ ]]
          echo "SRWF_WU02_PAGE_ID=$page_id" >> "$GITHUB_ENV"
          test -s "$SRWF_WU02_EVIDENCE_PATH"

      - name: Observe active frontend shell and content
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" server --host=127.0.0.1 --port=8080 --path="$SRWF_WP_PATH" >"$SRWF_ARTIFACT_DIR/server-active.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          active_status=''
          for _ in {1..30}; do
            active_status="$(curl --silent --output "$SRWF_ARTIFACT_DIR/active.html" --write-out '%{http_code}' "http://127.0.0.1:8080/?page_id=$SRWF_WU02_PAGE_ID" || true)"
            if [[ "$active_status" != '000' ]]; then
              break
            fi
            sleep 1
          done
          test "$active_status" = '200'
          grep -q 'srwf-host-companion-registration-shell' "$SRWF_ARTIFACT_DIR/active.html"
          grep -q 'SRWF_WU02_PAGE_CONTENT_MARKER' "$SRWF_ARTIFACT_DIR/active.html"
          grep -q '<header' "$SRWF_ARTIFACT_DIR/active.html"
          grep -q '<footer' "$SRWF_ARTIFACT_DIR/active.html"
          python3 - "$SRWF_WU02_EVIDENCE_PATH" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          data['active_frontend'] = {
              'http_status': 200,
              'shell_marker_present': True,
              'page_content_marker_present': True,
              'header_present': True,
              'footer_present': True,
          }
          data['claims']['active_render_runtime_proven'] = True
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Deactivate product plugin and verify persistence/resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" plugin deactivate srwf-host-companion --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" plugin get srwf-host-companion --field=status --path="$SRWF_WP_PATH")" = 'inactive'
          export SRWF_WU02_PHASE=inactive
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/runtime-lab/wu02-runtime-core.php"

      - name: Observe frontend fallback after deactivation
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" option update home 'http://127.0.0.1:8081' --path="$SRWF_WP_PATH" >/dev/null
          php "$SRWF_WP_CLI" option update siteurl 'http://127.0.0.1:8081' --path="$SRWF_WP_PATH" >/dev/null
          php "$SRWF_WP_CLI" server --host=127.0.0.1 --port=8081 --path="$SRWF_WP_PATH" >"$SRWF_ARTIFACT_DIR/server-inactive.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          inactive_status=''
          for _ in {1..30}; do
            inactive_status="$(curl --silent --output "$SRWF_ARTIFACT_DIR/inactive.html" --write-out '%{http_code}' "http://127.0.0.1:8081/?page_id=$SRWF_WU02_PAGE_ID" || true)"
            if [[ "$inactive_status" != '000' ]]; then
              break
            fi
            sleep 1
          done
          test "$inactive_status" = '200'
          ! grep -q 'srwf-host-companion-registration-shell' "$SRWF_ARTIFACT_DIR/inactive.html"
          grep -q 'SRWF_WU02_PAGE_CONTENT_MARKER' "$SRWF_ARTIFACT_DIR/inactive.html"
          python3 - "$SRWF_WU02_EVIDENCE_PATH" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          data['inactive_frontend'] = {
              'http_status': 200,
              'shell_marker_present': False,
              'page_content_marker_present': True,
          }
          data['claims']['deactivation_runtime_proven'] = True
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Validate evidence and publish summary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$SRWF_WU02_EVIDENCE_PATH" "$SRWF_WP_VERSION" "$SRWF_PHP_VERSION" "$SRWF_TT25_VERSION" <<'PY'
          import json, sys
          path, wp, php, theme = sys.argv[1:]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          assert data['schema'] == 'srwf-host-companion-wu02-runtime-core-v2'
          assert data['environment']['wordpress_version'] == wp
          assert data['environment']['php_version'] == php
          assert data['environment']['theme_stylesheet'] == 'twentytwentyfive'
          assert data['environment']['theme_version'] == theme
          assert data['template']['registration_identity'] == 'srwf-host-companion//registration-full-width'
          assert data['template']['assignment_slug'] == 'registration-full-width'
          normalized = data['configuration']['normalized_config']
          assert normalized['schema_version'] == 2
          assert set(normalized['roles']) == {'registration', 'inbox'}
          claims = data['claims']
          required = [
              'bootstrap_runtime_proven',
              'config_runtime_proven',
              'schema_v1_read_without_mutation',
              'inbox_explicit_schema_v2_upgrade',
              'role_setters_preserve_other_role',
              'malformed_config_fails_closed',
              'template_registration_runtime_proven',
              'assignment_runtime_proven',
              'no_hidden_mutation_runtime_proven',
              'active_render_runtime_proven',
              'deactivation_runtime_proven',
          ]
          data['capture_status'] = 'COMPLETE' if all(claims.get(key) for key in required) else 'PARTIAL'
          assert data['capture_status'] == 'COMPLETE'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('WU-02 capture status:', data['capture_status'])
          PY
          echo '### WU-02 Minimal Runtime Core' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$SRWF_WU02_EVIDENCE_PATH" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              d = json.load(f)
          env = d['environment']
          print(f"- capture status: `{d['capture_status']}`")
          print(f"- exact disposable tuple: WordPress `{env['wordpress_version']}`, PHP `{env['php_version']}`, `{env['theme_name']}` `{env['theme_version']}`")
          print(f"- registration API identity: `{d['template']['registration_identity']}`")
          print(f"- assignment value: `{d['template']['assignment_slug']}`")
          print('- configuration: schema-v1 read without mutation, explicit Inbox upgrade to schema v2, two-role preservation, and malformed-state fail-closed: `PASS`')
          print('- template registration, Registration assignment, no-hidden-mutation, active render, and deactivation fallback: `PASS`')
          print('- Inbox admin mutation/geometry, real Gravity Flow Inbox/GPP integration, browser E2E, and production qualification: evaluated only by their own bounded checks; not promoted here')
          PY

      - name: Upload machine-readable WU-02 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wu02-runtime-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/srwf-host-companion-artifacts/
          if-no-files-found: error
          retention-days: 30
