name: WU-04 Diagnostics and Drift

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'srwf-host-companion.php'
      - 'src/**'
      - 'templates/**'
      - 'tests/runtime-lab/wu04-diagnostics-drift.php'
      - 'tests/runtime-lab/wu04-theme-drift.php'
      - '.github/workflows/wu04-diagnostics-drift.yml'

permissions:
  contents: read

jobs:
  diagnostics-drift:
    name: WordPress diagnostics/drift qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SRWF_WP_PATH: /tmp/srwf-host-companion-wordpress
      SRWF_ARTIFACT_DIR: /tmp/srwf-host-companion-artifacts
      SRWF_WU04_EVIDENCE_PATH: /tmp/srwf-host-companion-artifacts/wu04-diagnostics-drift.json
      SRWF_WU04_THEME_EVIDENCE_PATH: /tmp/srwf-host-companion-theme-evidence.json
      SRWF_WP_VERSION: '7.1.1'
      SRWF_PHP_VERSION: '8.3.33'
      SRWF_TT25_VERSION: '1.5'
      SRWF_WP_CLI: /tmp/wp-cli.phar
      SRWF_WP_CLI_VERSION: '2.12.0'
      SRWF_WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      SRWF_TESTED_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SRWF_TESTED_COMMIT_SHA }}
          fetch-depth: 1

      - name: Assert repository and checkout identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'rezahh107/SRWF-Host-Companion'
          test "$(git rev-parse HEAD)" = "$SRWF_TESTED_COMMIT_SHA"
          mkdir -p "$SRWF_ARTIFACT_DIR" "$SRWF_WP_PATH"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.33'
          coverage: none
          extensions: mysqli

      - name: Validate PHP syntax and exact PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "$SRWF_PHP_VERSION"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z)

      - name: Install exact WP-CLI and WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 -o "$SRWF_WP_CLI" "https://github.com/wp-cli/wp-cli/releases/download/v${SRWF_WP_CLI_VERSION}/wp-cli-${SRWF_WP_CLI_VERSION}.phar"
          printf '%s  %s\n' "$SRWF_WP_CLI_SHA256" "$SRWF_WP_CLI" | sha256sum -c -
          php "$SRWF_WP_CLI" core download --path="$SRWF_WP_PATH" --version="$SRWF_WP_VERSION" --force
          php "$SRWF_WP_CLI" config create --path="$SRWF_WP_PATH" --dbname=wordpress --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          admin_password="$(openssl rand -hex 24)"
          php "$SRWF_WP_CLI" core install --path="$SRWF_WP_PATH" --url=http://127.0.0.1:8080 --title='SRWF Host Companion WU-04 Lab' --admin_user=runtime_admin --admin_password="$admin_password" --admin_email='runtime@example.invalid' --skip-email
          unset admin_password
          test "$(php "$SRWF_WP_CLI" core version --path="$SRWF_WP_PATH")" = "$SRWF_WP_VERSION"
          php "$SRWF_WP_CLI" theme install twentytwentyfive --version="$SRWF_TT25_VERSION" --force --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=version --path="$SRWF_WP_PATH")" = "$SRWF_TT25_VERSION"
          php "$SRWF_WP_CLI" theme activate twentytwentyfive --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=status --path="$SRWF_WP_PATH")" = 'active'

      - name: Install and activate product plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          plugin_dir="$SRWF_WP_PATH/wp-content/plugins/srwf-host-companion"
          mkdir -p "$plugin_dir"
          cp srwf-host-companion.php "$plugin_dir/"
          cp -R src templates "$plugin_dir/"
          php "$SRWF_WP_CLI" plugin activate srwf-host-companion --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" plugin get srwf-host-companion --field=status --path="$SRWF_WP_PATH")" = 'active'
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval 'exit( class_exists("SRWF\\HostCompanion\\TemplateDiagnostics", false) && class_exists("SRWF\\HostCompanion\\AdminSettings", false) ? 0 : 1 );'

      - name: Exercise WU-04 theme-source Block Hooks falsification
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/runtime-lab/wu04-theme-drift.php"
          test -s "$SRWF_WU04_THEME_EVIDENCE_PATH"

      - name: Exercise WU-04 provider and DB qualification fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/runtime-lab/wu04-diagnostics-drift.php"
          test -s "$SRWF_WU04_EVIDENCE_PATH"

      - name: Validate evidence and publish summary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$SRWF_WU04_EVIDENCE_PATH" "$SRWF_TESTED_COMMIT_SHA" "$SRWF_WP_VERSION" "$SRWF_PHP_VERSION" "$SRWF_TT25_VERSION" <<'PY'
          import json, sys
          path, sha, wp, php, theme = sys.argv[1:]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)

          assert data['schema'] == 'srwf-host-companion-wu04-diagnostics-drift-v2'
          assert data['tested_commit_sha'] == sha
          assert data['capture_status'] == 'PASS'
          assert data['environment']['wordpress_version'] == wp
          assert data['environment']['php_version'] == php
          assert data['environment']['theme_stylesheet'] == 'twentytwentyfive'
          assert data['environment']['theme_version'] == theme

          provider = data['runtime_contract']['provider_observation']
          assert provider['status'] == 'PASS'
          assert provider['draft_db_excluded'] == 'PASS'
          assert provider['trash_db_excluded'] == 'PASS'
          assert provider['published_db_selected'] == 'PASS'

          raw = data['runtime_contract']['raw_source_comparison']
          assert raw['status'] == 'PASS'
          assert raw['db_block_hooks_equivalent'] == 'PASS'
          assert raw['theme_block_hooks_equivalent'] == 'PASS'
          assert raw['db_material_positive_control'] == 'PASS'
          assert raw['theme_material_positive_control'] == 'PASS'
          assert data['runtime_contract']['normalization']['status'] == 'PASS'

          canonical = data['runtime_contract']['canonical_provider']
          assert canonical['source'] == 'plugin'
          assert canonical['origin'] == 'plugin'
          assert canonical['plugin'] == 'srwf-host-companion'
          assert canonical['provider_status'] == 'PASS'
          assert canonical['content_comparison'] == 'NOT_PROVEN'
          assert data['limitations']['registered_plugin_direct_content_equivalence'] == 'NOT_PROVEN_NATIVE_BLOCK_HOOKS_TRANSFORM'

          required = {
              'canonical': 'CANONICAL',
              'wrong_page_assignment': 'WRONG_PAGE_ASSIGNMENT',
              'page_not_published': 'PAGE_NOT_PUBLISHED',
              'page_missing': 'PAGE_INVALID',
              'page_trashed': 'PAGE_INVALID',
              'page_type_invalid': 'PAGE_INVALID',
              'db_draft_not_active': 'CANONICAL',
              'db_trash_not_active': 'CANONICAL',
              'db_override_block_hooks_equivalent': 'CUSTOMIZED_DB_OVERRIDE',
              'db_override_block_hooks_material': 'CUSTOMIZED_DB_OVERRIDE',
              'theme_override_block_hooks_equivalent': 'THEME_OVERRIDE',
              'theme_override_block_hooks_material': 'THEME_OVERRIDE',
              'missing_template': 'MISSING_TEMPLATE',
              'unknown': 'UNKNOWN',
          }
          for name, expected_primary in required.items():
              fixture = data['states'][name]
              assert fixture['status'] == 'PASS'
              assert fixture['actual_primary'] == expected_primary
              assert fixture['non_mutation'] == 'PASS'
              assert fixture['check_again_exercised'] is True

          for name in ['db_draft_not_active', 'db_trash_not_active']:
              assert data['states'][name]['resolution_evidence']['provider']['source'] == 'plugin'
          for name in ['db_override_block_hooks_equivalent', 'db_override_block_hooks_material']:
              ev = data['states'][name]['resolution_evidence']
              assert ev['provider']['source'] == 'custom'
              assert ev['provider']['template_status'] == 'publish'
              assert ev['source_comparison']['basis'] == 'RAW_DB_WP_TEMPLATE_POST_CONTENT'
              assert ev['transformed_resolved']['transformation_status'] == 'CORE_BLOCK_HOOKS_APPLIED'
          assert data['states']['db_override_block_hooks_equivalent']['resolution_evidence']['source_comparison']['content_matches_canonical'] is True
          assert data['states']['db_override_block_hooks_material']['resolution_evidence']['source_comparison']['content_matches_canonical'] is False

          for name in ['theme_override_block_hooks_equivalent', 'theme_override_block_hooks_material']:
              ev = data['states'][name]['resolution_evidence']
              assert ev['provider']['source'] == 'theme'
              assert ev['source_comparison']['basis'] == 'RAW_THEME_FILE_CONTENT'
              assert ev['transformed_resolved']['transformation_status'] == 'CORE_BLOCK_HOOKS_APPLIED'
              assert data['states'][name]['block_hooks_observed'] is True
          assert data['states']['theme_override_block_hooks_equivalent']['resolution_evidence']['source_comparison']['content_matches_canonical'] is True
          assert data['states']['theme_override_block_hooks_material']['resolution_evidence']['source_comparison']['content_matches_canonical'] is False

          assert data['states']['canonical']['resolution_evidence']['source_comparison']['content_matches_canonical'] is None
          assert data['states']['canonical']['resolution_evidence']['source_comparison']['status'] == 'NOT_PROVEN'
          assert data['states']['unknown']['resolution_evidence']['provider']['source'] == 'external-fixture'
          assert data['unsupported_states'] == []
          assert data['diagnostic_report']['status'] == 'PASS'

          for claim in [
              'diagnostics_runtime_proven', 'frontend_provider_eligibility', 'raw_source_drift_comparison',
              'block_hooks_source_boundary', 'material_drift_positive_controls', 'check_again_read_only',
              'no_hidden_repair', 'page_validity_reused', 'normalized_raw_source_drift_comparison',
              'privacy_safe_report', 'qualification_lab_wu04_slice'
          ]:
              assert data['claims'][claim] == 'PASS'

          assert data['claim_ceiling']['wu05_full_width_geometry'] == 'NOT_PROVEN'
          assert data['claim_ceiling']['wu06_browser_admin_qualification'] == 'NOT_RUN'
          assert data['claim_ceiling']['wu07_browser_e2e_comprehension'] == 'NOT_RUN'
          assert data['claim_ceiling']['production_qualification'] == 'NOT_PROVEN'
          print('WU-04 repaired capture status: PASS')
          PY

          echo '### WU-04 Read-only Diagnostics and Drift — repaired evidence boundary' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$SRWF_WU04_EVIDENCE_PATH" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              d = json.load(f)
          env = d['environment']
          print(f"- capture status: `{d['capture_status']}`")
          print(f"- exact tested head: `{d['tested_commit_sha']}`")
          print(f"- exact disposable tuple: WordPress `{env['wordpress_version']}`, PHP `{env['php_version']}`, `{env['theme_name']}` `{env['theme_version']}`")
          print('- frontend-provider model: exact-slug `get_block_templates()` published candidates; draft/trash DB exclusion + published DB selection: `PASS`')
          print('- raw-source Block Hooks falsification: DB equivalent + theme equivalent: `PASS`')
          print('- material-drift positive controls under Block Hooks: DB + theme: `PASS`')
          print('- diagnostics/render/Check Again non-mutation and no hidden repair: `PASS`')
          print('- registered plugin raw-source/resolved content equivalence: `NOT_PROVEN` (native Block Hooks transform)')
          print('- evidence level: `WORDPRESS_INTEGRATION / AUTOMATED_QUALIFICATION_LAB_WU04_SLICE`')
          print('- WU-05: `NOT_PROVEN`; WU-06: `NOT_RUN`; WU-07: `NOT_RUN`; Production Qualification: `NOT_PROVEN`')
          PY

      - name: Upload machine-readable WU-04 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wu04-diagnostics-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/srwf-host-companion-artifacts/
          if-no-files-found: error
          retention-days: 30
