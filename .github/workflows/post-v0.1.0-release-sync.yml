name: One-time post-v0.1.0 release state sync

on:
  push:
    branches: ['docs/post-v0.1.0-release-sync']
    paths:
      - '.github/workflows/post-v0.1.0-release-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/post-v0.1.0-release-sync
          fetch-depth: 0

      - name: Apply exact factual post-release replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'README.md',
              'No GitHub Release has been published.',
              'GitHub Release `v0.1.0` was published on 2026-09-21 with the installable ZIP and SHA-256 checksum attached.',
          )
          replace_once(
              'README.md',
              'Production release: NOT_PUBLISHED',
              'Personal GitHub release v0.1.0: PUBLISHED',
          )

          replace_once(
              'AGENTS.md',
              '; no GitHub Release has been published',
              '; personal GitHub Release `v0.1.0` is published',
          )

          replace_once(
              'CHANGELOG.md',
              'No GitHub Release has been published yet.',
              'GitHub Release `v0.1.0` was published on 2026-09-21.',
          )
          replace_once(
              'CHANGELOG.md',
              '## [Unreleased]\n\n### Added',
              '## [Unreleased]\n\nNo unreleased changes yet.\n\n## [0.1.0] - 2026-09-21\n\n### Added',
          )
          replace_once(
              'CHANGELOG.md',
              'Production release: NOT_PUBLISHED',
              'Personal GitHub release v0.1.0: PUBLISHED',
          )

          replace_once(
              'docs/implementation/V0_IMPLEMENTATION_PLAN.md',
              '**Status:** `APPROVED_SEQUENCE / EXECUTION_IN_PROGRESS`',
              '**Status:** `V0_IMPLEMENTED / PERSONAL_GITHUB_RELEASE_V0_1_0_PUBLISHED / STRONGER_PRODUCTION_QUALIFICATION_NOT_PROVEN`',
          )
          release_identity_line = 'Exact final-head workflow/run/artifact identity belongs in focused PR/release evidence rather than durable plan text.'
          replace_once(
              'docs/implementation/V0_IMPLEMENTATION_PLAN.md',
              release_identity_line,
              'Personal GitHub Release `v0.1.0` was published from `main` on 2026-09-21 with the validated installable ZIP and SHA-256 checksum. This publication closes the Owner-approved personal GitHub release outcome without changing the stronger Production Qualification claim ceiling.\n\n' + release_identity_line,
          )

          replace_once(
              'tests/release/verify-release-contract.py',
              '    if "Production release: NOT_PUBLISHED" not in status_section:\n        errors.append("CHANGELOG no longer preserves Production release = NOT_PUBLISHED")',
              '    if "Personal GitHub release v0.1.0: PUBLISHED" not in status_section:\n        errors.append("CHANGELOG no longer records personal GitHub release v0.1.0 = PUBLISHED")',
          )
          replace_once(
              'tests/release/verify-release-contract.py',
              '        "README still describes WU-06 by open-PR lifecycle": r"WU-06[^\\n]*implemented in PR #10",\n',
              '        "README still describes WU-06 by open-PR lifecycle": r"WU-06[^\\n]*implemented in PR #10",\n        "README still says no GitHub Release has been published": r"No GitHub Release has been published",\n',
          )
          replace_once(
              'tests/release/verify-release-contract.py',
              '        "a production release is requested before a license is explicitly selected",\n',
              '        "a production release is requested before a license is explicitly selected",\n        "no GitHub Release has been published",\n',
          )
          PY

      - name: Verify synchronized release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/release/verify-release-contract.py --root .
          python3 tests/release/verify-release-contract.py --root . --self-test
          git diff --check

      - name: Remove one-time workflow and commit sync
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/post-v0.1.0-release-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md CHANGELOG.md SECURITY.md docs/implementation/V0_IMPLEMENTATION_PLAN.md tests/release/verify-release-contract.py .github/workflows/post-v0.1.0-release-sync.yml
          git diff --cached --check
          git commit -m 'docs: sync repository after v0.1.0 publication'
          git push origin HEAD:docs/post-v0.1.0-release-sync
