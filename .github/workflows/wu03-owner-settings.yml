name: WU-03 Owner Settings

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'srwf-host-companion.php'
      - 'src/**'
      - 'tests/runtime-lab/wu03-owner-settings.php'
      - '.github/workflows/wu03-owner-settings.yml'

permissions:
  contents: read

jobs:
  owner-settings:
    name: WordPress Owner settings integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SRWF_WP_PATH: /tmp/srwf-host-companion-wordpress
      SRWF_ARTIFACT_DIR: /tmp/srwf-host-companion-artifacts
      SRWF_WU03_EVIDENCE_PATH: /tmp/srwf-host-companion-artifacts/wu03-owner-settings.json
      SRWF_WP_VERSION: '7.1.1'
      SRWF_PHP_VERSION: '8.3.33'
      SRWF_TT25_VERSION: '1.5'
      SRWF_WP_CLI: /tmp/wp-cli.phar
      SRWF_WP_CLI_VERSION: '2.12.0'
      SRWF_WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c

    steps:
      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert repository and checkout identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'rezahh107/SRWF-Host-Companion'
          observed="$(git rev-parse HEAD)"
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$observed" = "$expected"
          mkdir -p "$SRWF_ARTIFACT_DIR" "$SRWF_WP_PATH"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.33'
          coverage: none
          extensions: mysqli

      - name: Validate PHP syntax and exact PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "$SRWF_PHP_VERSION"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z)

      - name: Install exact WP-CLI and WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 \
            -o "$SRWF_WP_CLI" \
            "https://github.com/wp-cli/wp-cli/releases/download/v${SRWF_WP_CLI_VERSION}/wp-cli-${SRWF_WP_CLI_VERSION}.phar"
          printf '%s  %s\n' "$SRWF_WP_CLI_SHA256" "$SRWF_WP_CLI" | sha256sum -c -
          php "$SRWF_WP_CLI" core download --path="$SRWF_WP_PATH" --version="$SRWF_WP_VERSION" --force
          php "$SRWF_WP_CLI" config create --path="$SRWF_WP_PATH" \
            --dbname=wordpress --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          admin_password="$(openssl rand -hex 24)"
          php "$SRWF_WP_CLI" core install --path="$SRWF_WP_PATH" \
            --url=http://127.0.0.1:8080 --title='SRWF Host Companion WU-03 Lab' \
            --admin_user=runtime_admin --admin_password="$admin_password" \
            --admin_email='runtime@example.invalid' --skip-email
          unset admin_password
          test "$(php "$SRWF_WP_CLI" core version --path="$SRWF_WP_PATH")" = "$SRWF_WP_VERSION"
          php "$SRWF_WP_CLI" theme install twentytwentyfive --version="$SRWF_TT25_VERSION" --force --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=version --path="$SRWF_WP_PATH")" = "$SRWF_TT25_VERSION"
          php "$SRWF_WP_CLI" theme activate twentytwentyfive --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=status --path="$SRWF_WP_PATH")" = 'active'

      - name: Install and activate product plugin
        shell: bash
        run: |
          set -Eeuo pipefail
          plugin_dir="$SRWF_WP_PATH/wp-content/plugins/srwf-host-companion"
          mkdir -p "$plugin_dir"
          cp srwf-host-companion.php "$plugin_dir/"
          cp -R src templates "$plugin_dir/"
          php "$SRWF_WP_CLI" plugin activate srwf-host-companion --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" plugin get srwf-host-companion --field=status --path="$SRWF_WP_PATH")" = 'active'
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval 'exit( class_exists("SRWF\\HostCompanion\\AdminSettings", false) ? 0 : 1 );'

      - name: Exercise WU-03 Owner settings contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/runtime-lab/wu03-owner-settings.php"
          test -s "$SRWF_WU03_EVIDENCE_PATH"

      - name: Validate evidence and publish summary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$SRWF_WU03_EVIDENCE_PATH" "$SRWF_WP_VERSION" "$SRWF_PHP_VERSION" "$SRWF_TT25_VERSION" <<'PY'
          import json, sys
          path, wp, php, theme = sys.argv[1:]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          assert data['schema'] == 'srwf-host-companion-wu03-owner-settings-v1'
          assert data['environment']['wordpress_version'] == wp
          assert data['environment']['php_version'] == php
          assert data['environment']['theme_stylesheet'] == 'twentytwentyfive'
          assert data['environment']['theme_version'] == theme
          required = [
              'plugin_load',
              'settings_surface_registered',
              'unauthorized_render_blocked',
              'render_side_effect_free',
              'valid_save_persists_configuration',
              'valid_apply_assigns_and_reads_back',
              'previous_page_not_rewritten',
              'invalid_target_fails_closed',
              'wrong_post_type_fails_closed',
              'non_published_distinguished',
              'nonce_failure_fails_closed',
              'target_edit_capability_enforced',
              'truthful_success_result',
          ]
          claims = data['claims']
          assert all(claims.get(key) is True for key in required)
          assert claims['browser_e2e_proven'] is False
          assert claims['full_width_geometry_proven'] is False
          assert claims['diagnostics_drift_proven'] is False
          assert claims['production_qualification_proven'] is False
          data['capture_status'] = 'COMPLETE'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('WU-03 capture status:', data['capture_status'])
          PY
          echo '### WU-03 Owner Settings Workflow' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$SRWF_WU03_EVIDENCE_PATH" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              d = json.load(f)
          env = d['environment']
          print(f"- capture status: `{d['capture_status']}`")
          print(f"- exact disposable tuple: WordPress `{env['wordpress_version']}`, PHP `{env['php_version']}`, `{env['theme_name']}` `{env['theme_version']}`")
          print('- settings registration, side-effect-free render, authorization/nonce guards, page classification, schema-v1 persistence, assignment/readback, page-change safety, and truthful bounded result state: `PASS`')
          print('- evidence level: `WORDPRESS_INTEGRATION` (not browser/E2E)')
          print('- WU-04 diagnostics/drift, WU-05 Full Width geometry, browser/E2E, accessibility/comprehension qualification, and production qualification: `NOT_PROVEN`')
          PY

      - name: Upload machine-readable WU-03 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wu03-owner-settings-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/srwf-host-companion-artifacts/
          if-no-files-found: error
          retention-days: 30
