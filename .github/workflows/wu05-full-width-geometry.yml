name: WU-05 Full Width Geometry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'srwf-host-companion.php'
      - 'src/**'
      - 'templates/**'
      - 'tests/runtime-lab/wu05-full-width.php'
      - 'tests/browser/wu05-full-width.mjs'
      - '.github/workflows/wu05-full-width-geometry.yml'

permissions:
  contents: read

jobs:
  full-width-geometry:
    name: Real-browser Full Width qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4.8@sha256:bc474f00629f0123c10f9e1bca193a45d18af15a274cf0656acda64f1086c3b6
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SRWF_WP_PATH: /tmp/srwf-host-companion-wordpress
      SRWF_ARTIFACT_DIR: /tmp/srwf-host-companion-artifacts
      SRWF_WU05_EVIDENCE_PATH: /tmp/srwf-host-companion-artifacts/wu05-full-width-geometry.json
      SRWF_WU05_BASE_URL: http://127.0.0.1:8080
      SRWF_WP_VERSION: '7.1.1'
      SRWF_PHP_VERSION: '8.3.33'
      SRWF_TT25_VERSION: '1.5'
      SRWF_WP_CLI: /tmp/wp-cli.phar
      SRWF_WP_CLI_VERSION: '2.12.0'
      SRWF_WP_CLI_SHA256: ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c
      SRWF_PLAYWRIGHT_VERSION: '1.63.0'
      SRWF_NODE_VERSION: '22.19.0'
      SRWF_TESTED_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SRWF_TESTED_COMMIT_SHA }}
          fetch-depth: 1

      - name: Assert repository and checkout identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'rezahh107/SRWF-Host-Companion'
          test "$(git rev-parse HEAD)" = "$SRWF_TESTED_COMMIT_SHA"
          mkdir -p "$SRWF_ARTIFACT_DIR" "$SRWF_WP_PATH"

      - name: Set up exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3.33'
          coverage: none
          extensions: mysqli

      - name: Validate PHP syntax and exact PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(php -r 'echo PHP_VERSION;')" = "$SRWF_PHP_VERSION"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0 | sort -z)
          node --check tests/browser/wu05-full-width.mjs

      - name: Install exact WP-CLI, WordPress, and Twenty Twenty-Five
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L --fail --retry 3 -o "$SRWF_WP_CLI" "https://github.com/wp-cli/wp-cli/releases/download/v${SRWF_WP_CLI_VERSION}/wp-cli-${SRWF_WP_CLI_VERSION}.phar"
          printf '%s  %s\n' "$SRWF_WP_CLI_SHA256" "$SRWF_WP_CLI" | sha256sum -c -
          php "$SRWF_WP_CLI" core download --path="$SRWF_WP_PATH" --version="$SRWF_WP_VERSION" --force
          php "$SRWF_WP_CLI" config create --path="$SRWF_WP_PATH" --dbname=wordpress --dbuser=root --dbpass='' --dbhost=127.0.0.1:3306 --skip-check
          admin_password="$(openssl rand -hex 24)"
          php "$SRWF_WP_CLI" core install --path="$SRWF_WP_PATH" --url="$SRWF_WU05_BASE_URL" --title='SRWF Host Companion WU-05 Lab' --admin_user=runtime_admin --admin_password="$admin_password" --admin_email='runtime@example.invalid' --skip-email
          unset admin_password
          test "$(php "$SRWF_WP_CLI" core version --path="$SRWF_WP_PATH")" = "$SRWF_WP_VERSION"
          php "$SRWF_WP_CLI" theme install twentytwentyfive --version="$SRWF_TT25_VERSION" --force --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" theme get twentytwentyfive --field=version --path="$SRWF_WP_PATH")" = "$SRWF_TT25_VERSION"
          php "$SRWF_WP_CLI" theme activate twentytwentyfive --path="$SRWF_WP_PATH"
          php "$SRWF_WP_CLI" language core install fa_IR --path="$SRWF_WP_PATH"
          php "$SRWF_WP_CLI" site switch-language fa_IR --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" option get WPLANG --path="$SRWF_WP_PATH")" = 'fa_IR'

      - name: Install and activate exact product head
        shell: bash
        run: |
          set -Eeuo pipefail
          plugin_dir="$SRWF_WP_PATH/wp-content/plugins/srwf-host-companion"
          mkdir -p "$plugin_dir"
          cp srwf-host-companion.php "$plugin_dir/"
          cp -R src templates "$plugin_dir/"
          php "$SRWF_WP_CLI" plugin activate srwf-host-companion --path="$SRWF_WP_PATH"
          test "$(php "$SRWF_WP_CLI" plugin get srwf-host-companion --field=status --path="$SRWF_WP_PATH")" = 'active'

      - name: Create deterministic WU-05 fixture and assignment evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          page_id="$(php "$SRWF_WP_CLI" --path="$SRWF_WP_PATH" eval-file "$GITHUB_WORKSPACE/tests/runtime-lab/wu05-full-width.php" | tail -n 1)"
          [[ "$page_id" =~ ^[0-9]+$ ]]
          test -s "$SRWF_WU05_EVIDENCE_PATH"
          echo "SRWF_WU05_PAGE_ID=$page_id" >> "$GITHUB_ENV"

      - name: Set up pinned browser automation runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node --version)" = "v${SRWF_NODE_VERSION}"
          npm install --no-save --ignore-scripts "playwright@${SRWF_PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Start exact WordPress frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$SRWF_WP_CLI" server --host=127.0.0.1 --port=8080 --path="$SRWF_WP_PATH" >"$SRWF_ARTIFACT_DIR/server.log" 2>&1 &
          echo "SRWF_WU05_SERVER_PID=$!" >> "$GITHUB_ENV"
          status=''
          for _ in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$SRWF_WU05_BASE_URL/?page_id=$SRWF_WU05_PAGE_ID" || true)"
            if [[ "$status" = '200' ]]; then
              break
            fi
            sleep 1
          done
          test "$status" = '200'

      - name: Exercise real-browser RTL geometry matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          node tests/browser/wu05-full-width.mjs

      - name: Validate bounded machine-readable WU-05 evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$SRWF_WU05_EVIDENCE_PATH"
          python3 - "$SRWF_WU05_EVIDENCE_PATH" "$SRWF_TESTED_COMMIT_SHA" "$SRWF_WP_VERSION" "$SRWF_PHP_VERSION" "$SRWF_TT25_VERSION" <<'PY'
          import json, sys
          path, sha, wp, php, theme = sys.argv[1:]
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          assert data['schema'] == 'srwf-host-companion-wu05-full-width-v1'
          assert data['tested_commit_sha'] == sha
          assert data['environment']['wordpress_version'] == wp
          assert data['environment']['php_version'] == php
          assert data['environment']['theme_stylesheet'] == 'twentytwentyfive'
          assert data['environment']['theme_version'] == theme
          assert data['environment']['locale'] == 'fa_IR'
          assert data['canonical_template']['api_identity'] == 'srwf-host-companion//registration-full-width'
          assert data['canonical_template']['assignment_slug'] == 'registration-full-width'
          assert data['canonical_template']['assigned_readback'] == 'registration-full-width'
          assert data['layout_hypothesis']['name'] == 'H1'
          assert data['layout_hypothesis']['product_css'] is False
          assert data['layout_hypothesis']['product_js'] is False
          assert set(data['viewports']) == {'320', '390', '430', '1440'}
          assert all(data['viewports'][key]['status'] == 'PASS' for key in data['viewports'])
          assert data['claims']['canonical_assignment_render'] == 'PASS'
          assert data['claims']['full_width_geometry'] == 'PASS'
          assert data['claims']['horizontal_overflow'] == 'PASS'
          assert data['claims']['header_footer_navigation'] == 'PASS'
          assert data['claims']['rtl_frontend'] == 'PASS'
          assert data['layout_hypothesis']['status'] == 'SUPPORTED_ON_PINNED_TARGET_TUPLE'
          assert data['dependencies']['gravity_forms']['availability'] == 'ENVIRONMENT_UNAVAILABLE'
          assert data['dependencies']['orbital']['availability'] == 'ENVIRONMENT_UNAVAILABLE'
          assert data['dependencies']['gtb']['availability'] == 'ENVIRONMENT_UNAVAILABLE'
          assert data['dependencies']['vazir_vazirmatn']['availability'] == 'ENVIRONMENT_UNAVAILABLE'
          assert data['claims']['wu06_admin_rtl_accessibility_security'] == 'NOT_RUN'
          assert data['claims']['wu07_owner_browser_e2e_comprehension'] == 'NOT_RUN'
          assert data['claims']['production_host_qualification'] == 'NOT_PROVEN'
          assert data['overall_status'] == 'FULL_WIDTH_GEOMETRY_AUTOMATED_QUALIFIED_ON_PINNED_TARGET_TUPLE'
          print('WU-05 automated geometry qualification:', data['overall_status'])
          PY

          echo '### WU-05 Full Width Host Canvas' >> "$GITHUB_STEP_SUMMARY"
          python3 - "$SRWF_WU05_EVIDENCE_PATH" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              d = json.load(f)
          env = d['environment']
          print(f"- exact tested head: `{d['tested_commit_sha']}`")
          print(f"- exact disposable tuple: WordPress `{env['wordpress_version']}`, PHP `{env['php_version']}`, `{env['theme_name']}` `{env['theme_version']}`, locale `{env['locale']}`")
          print(f"- browser: Chromium `{d['browser']['browser_version']}` via Playwright `{d['browser']['playwright_version']}`")
          print(f"- H1 native block-layout falsification: `{d['layout_hypothesis']['status']}`")
          for width in ['320', '390', '430', '1440']:
              v = d['viewports'][width]
              a = v['application_region']
              print(f"- {width}px RTL: app width `{a['width']}px`; inline gutters `{a['inline_start_gutter']}px / {a['inline_end_gutter']}px`; overflow `{v['overflow']['status']}`; host chrome `{v['host_integrity']['header']}/{v['host_integrity']['footer']}/{v['host_integrity']['navigation']}`")
          print('- Gravity Forms / Orbital / GTB / approved Vazir-Vazirmatn dependency-backed regression: `ENVIRONMENT_UNAVAILABLE / NOT_PROVEN`')
          print('- WU-06: `NOT_RUN`; WU-07: `NOT_RUN`; production host qualification: `NOT_PROVEN`')
          print(f"- bounded status: `{d['overall_status']}`")
          PY

      - name: Stop WordPress frontend
        if: always()
        shell: bash
        run: |
          if [[ -n "${SRWF_WU05_SERVER_PID:-}" ]]; then
            kill "$SRWF_WU05_SERVER_PID" 2>/dev/null || true
            wait "$SRWF_WU05_SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload WU-05 evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wu05-full-width-geometry-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/srwf-host-companion-artifacts/
          if-no-files-found: error
          retention-days: 30
