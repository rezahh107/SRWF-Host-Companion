name: Apply approved product vision amendment

on:
  push:
    paths:
      - '.github/workflows/apply-product-vision.yml'

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved v0.5 amendment
        run: python .github/scripts/apply_product_vision.py

      - name: Commit amendment when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/architecture/MOTHER_ARCHITECTURE.md; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/MOTHER_ARCHITECTURE.md
          git commit -m 'docs: add product vision to mother architecture'
          git push
